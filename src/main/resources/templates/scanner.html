<div id="scanner-container" style="width: 100%; height: 400px; overflow: hidden"></div>
<form id="barcodeForm" action="/scan-result" method="post" th:object="${newCard}">
    <label for="barcode">Scanned code: </label>
    <input type="text" name="barcode" id="barcode" th:field="*{cardNumber}">
    <input type="number" name="cardPrice" id="cardPrice" th:field="*{cardPrice}" value="400">
    <button type="button" onclick="scanning()">Scan again</button>
    <button type="submit">Submit</button>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", scanning());

    function scanning() {
        document.querySelector("#barcode").value = ""; // Clear previous barcode

        Quagga.init(
            {
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector("#scanner-container"), // Place where video will appear
                    constraints: {
                        facingMode: "environment", // Use back camera on mobile
                    },
                },
                decoder: {
                    readers: ["ean_reader", "code_128_reader", "upc_reader", "code_39_reader"], // Types of barcodes
                },
            },
            function (err) {
                if (err) {
                    console.error("QuaggaJS error:", err);
                    return;
                }
                console.log("QuaggaJS initialized.");
                Quagga.start(); // Start scanning
            }
        );

        // Detect barcode
        Quagga.onDetected(function (result) {
            document.querySelector("#barcode").value = result.codeResult.code;
            Quagga.stop(); // Stop scanning after first detection
        });
    }

    document.addEventListener("DOMContentLoaded", function () {
        let form = document.getElementById("barcodeForm");
        let currentPath = window.location.pathname; // Get current URL path

        if (currentPath.startsWith("/ESNcards/add")) {
            form.action = "/ESNcards/add";
        } else if (currentPath.startsWith("/SIMCards/add")) {
            form.action = "/SIMcards/add/scan-result";
        }
    });
</script>
